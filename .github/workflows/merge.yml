name: Merge Pl deama
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # jalan tiap 2 jam

concurrency:
  group: merge-playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Merge playlists
        run: python merge.py

      - name: Commit & Push
        run: |
          git config user.name "deama-bot"
          git config user.email "bot@bot.com"
          git add eusi/listt
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "update merged pl deama even"
          git pull --rebase --autostash origin main
          git push origin main
